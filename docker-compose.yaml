services:
  contig-alias:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./local-config/application.properties:/app/config/application.properties:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/eva/webservices/contig-alias/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=contigalias_user
      - POSTGRES_PASSWORD=contigalias_password
      - POSTGRES_DB=contigalias_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contigalias_user -d contigalias_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
