spring.jpa.open-in-view=false

# credentials for the admin interface
# controller.auth.admin.username=username
# controller.auth.admin.password=password

management.endpoints.web.exposure.include=info,health
management.endpoints.web.base-path=/
management.info.git.mode=simple
management.metrics.binders.jvm.enabled=false

logging.level.uk.ac.ebi.eva.contigalias=DEBUG

# Database connection details (postgresql-url, username, password, ddl-auto), admin credentials
# and FTP proxy settings are supplied at runtime, not baked into this file:
#   - In Kubernetes, via a Secret mounted at /app/config/application.properties.
#   - For local IDE / mvn spring-boot:run, via a git-ignored ./config/application.properties
#     (Spring Boot automatically loads config/ relative to the working directory).
# See readme.md for the full list of required keys.
# spring.datasource.url=postgresql-url
# spring.datasource.username=postgresql-username
# spring.datasource.password=postgresql-password
# spring.jpa.hibernate.ddl-auto=ddl-auto

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true

server.servlet.context-path=/eva/webservices/contig-alias

# ftp.proxy.host=FTP
# ftp.proxy.port=FTP-port
# config.scaffolds.enabled = scaffold-enabled

asm.file.download.dir=/tmp

# remove spring data browsing endpoints (https://docs.spring.io/spring-data/rest/docs/3.3.x/reference/html/#getting-started.setting-repository-detection-strategy)
spring.data.rest.detection-strategy=annotated
spring.data.rest.basePath=/api
